version: 2
updates:
  # NuGet versions live in Directory.Packages.props (Central Package Management).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Do NOT let Dependabot rebase open PRs when main moves. With the default ("auto") it
    # re-resolves every open PR after each merge, and on 2026-07-21 that pass closed two
    # valid PRs as "no longer updatable" (#90 and #92) and deleted their branches seconds
    # apart; #92 was fully green and could not be reopened. Because main requires an
    # up-to-date branch anyway, refresh stale PRs deliberately with `gh pr update-branch`.
    rebase-strategy: "disabled"
    # Scoped Commits (scope-first, see CONTRIBUTING.md), not the conventional-commits default.
    commit-message:
      prefix: "deps"
    groups:
      analyzers:
        patterns:
          - "*.Analyzer*"
          - "StyleCop.*"
          - "SonarAnalyzer.*"
          - "Roslynator.*"
          - "Meziantou.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
          - "Azure.Monitor.OpenTelemetry.*"
      # The test stack moves together: bUnit renders through AngleSharp, and the xunit/Moq/
      # assertion packages are only ever consumed by test projects. Grouping them keeps a
      # bUnit bump and its AngleSharp dependency in ONE pull request instead of two that
      # touch the same lock files and therefore conflict with each other.
      testing:
        patterns:
          - "bunit*"
          - "AngleSharp*"
          - "xunit*"
          - "Moq"
          - "AwesomeAssertions"
          - "coverlet.*"
          - "NetArchTest.*"
          - "Testcontainers*"
          - "Respawn"
      # Catch-all for everything the groups above do not match, so ungrouped minor/patch
      # updates arrive as ONE weekly pull request rather than one per package. This repo's
      # CI is expensive (13 required checks including a MAUI windows build, three browser
      # a11y legs, a BenchmarkDotNet gate and a Testcontainers Redis tier), and "require
      # branches to be up to date" means every merge re-BEHINDs the rest, so N separate
      # dependency PRs cost N full re-runs. Majors stay ungrouped: those deserve their own
      # PR and their own read.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # MassTransit is pinned to v8 by policy (v9 requires a commercial license); enforced by a
      # fitness test. Don't let Dependabot propose the major bump. See Directory.Packages.props.
      - dependency-name: "MassTransit*"
        update-types: ["version-update:semver-major"]
      # ImageSharp is pinned to v3 by policy (v4 requires a commercial license key at BUILD time;
      # its MSBuild targets fail without one); enforced by the same fitness test. See
      # Directory.Packages.props.
      - dependency-name: "SixLabors.ImageSharp"
        update-types: ["version-update:semver-major"]
      # VS.Threading.Analyzers v18 adds stricter rules (e.g. VSTHRD103) that error under
      # TreatWarningsAsErrors; held at v17 until the flagged call sites are reworked.
      - dependency-name: "Microsoft.VisualStudio.Threading.Analyzers"
        update-types: ["version-update:semver-major"]
      # Microsoft.OpenApi is held at 2.x by a build constraint, not by preference. The
      # Microsoft.AspNetCore.OpenApi XML-comment source generator (pinned to the SDK band) is
      # written against 2.x, where IOpenApiMediaType.Example is settable; 3.x made it read only,
      # so the generated OpenApiXmlCommentSupport.generated.cs fails with CS0200 and takes the
      # consumer jobs down with it. Nothing here can override generated code. Revisit when
      # ASP.NET Core ships a generator targeting 3.x. See Directory.Packages.props.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # Breaking majors held back deliberately. MessagePack is also pinned to a patched 2.x to
      # override a vulnerable transitive (see Directory.Packages.props).
      - dependency-name: "StackExchange.Redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "MessagePack"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
