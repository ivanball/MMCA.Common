name: Release NuGet Packages

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write # OIDC token for nuget.org trusted publishing (ADR-053)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts and build/perfgate have no lock file and this repo does not pass
          # --locked-mode, so the props file is what actually pins their versions.
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore
        run: dotnet restore MMCA.Common.slnx

      - name: Determine version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: dotnet build MMCA.Common.slnx -c Release --no-restore -p:MinVerSkip=true -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test
        run: dotnet test --solution MMCA.Common.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack MMCA.Common.slnx -c Release --no-build -o ./nupkgs -p:MinVerSkip=true -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      # Software Bill of Materials for the released packages (CycloneDX).
      # Hard gate (R29 §32): every published version must ship a verifiable SBOM, so a failed
      # generation OR an empty/missing artifact fails the release (was continue-on-error while the
      # tooling was being validated in CI — now promoted to a blocking step).
      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX MMCA.Common.slnx --output ./sbom --json
          ls -la ./sbom
          test -n "$(ls -A ./sbom 2>/dev/null)" || { echo "::error::SBOM generation produced no output"; exit 1; }

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ./sbom
          if-no-files-found: error

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source "https://nuget.pkg.github.com/ivanball/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # nuget.org is the public install path (ADR-053). GitHub Packages' NuGet registry requires a
      # PAT with read:packages even for public packages, so a stranger following the README could
      # not restore. Both registries get every release.
      #
      # Auth is trusted publishing, not a stored API key: this job's OIDC token is exchanged for a
      # key that lives one hour, so there is no long-lived secret to leak or rotate. The exchange is
      # bound to a policy on nuget.org pinned to this owner, this repository, and THIS workflow file
      # by their permanent GitHub ids, so renaming the file or forking breaks the exchange by design.
      # Request the key immediately before the push: it expires in an hour and is single-use.
      - name: NuGet login (OIDC to short-lived key)
        if: github.repository_owner == 'ivanball'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ivanball # nuget.org profile name, not an email; public, so not a secret

      - name: Push to nuget.org
        if: github.repository_owner == 'ivanball'
        run: dotnet nuget push ./nupkgs/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

  # MMCA.Common.UI.Maui (the 15th package) cannot build on ubuntu — its four TFMs need the MAUI
  # workloads — so it packs on windows, versioned from the same tag so the lockstep release stays
  # whole. Same SBOM hard gate as the main job, scoped to this project.
  publish-maui:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      packages: write
      contents: read
      id-token: write # OIDC token for nuget.org trusted publishing (ADR-053)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts and build/perfgate have no lock file and this repo does not pass
          # --locked-mode, so the props file is what actually pins their versions.
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Determine version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build (all four MAUI TFMs)
        run: dotnet build Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj -c Release -p:MinVerSkip=true -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: dotnet pack Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj -c Release --no-build -o ./nupkgs-maui -p:MinVerSkip=true -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Generate SBOM (CycloneDX)
        shell: bash
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj --output ./sbom-maui --json
          ls -la ./sbom-maui
          test -n "$(ls -A ./sbom-maui 2>/dev/null)" || { echo "::error::SBOM generation produced no output"; exit 1; }

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-maui
          path: ./sbom-maui
          if-no-files-found: error

      - name: Push to GitHub Packages
        # bash, not the windows-default pwsh: PowerShell passes *.nupkg through unexpanded and
        # dotnet nuget push then fails with "File does not exist" on the un-globbed pattern.
        shell: bash
        run: dotnet nuget push ./nupkgs-maui/*.nupkg --source "https://nuget.pkg.github.com/ivanball/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # Same dual-registry policy and same trusted-publishing exchange as the main job (ADR-053);
      # same bash-not-pwsh globbing caveat. One nuget.org policy covers both jobs because it is
      # keyed on the workflow FILE, but each job needs its own id-token permission and its own
      # exchange: a short-lived key is single-use and cannot cross a job boundary.
      - name: NuGet login (OIDC to short-lived key)
        if: github.repository_owner == 'ivanball'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ivanball # nuget.org profile name, not an email; public, so not a secret

      - name: Push to nuget.org
        if: github.repository_owner == 'ivanball'
        shell: bash
        run: dotnet nuget push ./nupkgs-maui/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
