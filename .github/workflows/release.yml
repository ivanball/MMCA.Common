name: Release NuGet Packages

on:
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Two stages per package set. A `pack*` job holds `contents: read` only and does everything that
# runs repository or package code: restore, build, the vulnerability audit, tests, pack and the
# SBOM gate. It hands the packed files to the matching `publish*` job as a workflow artifact. The
# `publish*` job holds the `release` environment and the three write permissions (id-token,
# attestations, packages) and runs no repository code at all: no checkout, no restore, no build,
# no test. It downloads the artifact, attests it and pushes it to both registries. So no build-time
# dependency ever executes in a job that can mint the nuget.org trusted-publishing token.
#
# Both publish jobs need BOTH pack jobs: no registry receives any package of the lockstep set until
# every gate of every package (main set and MMCA.Common.UI.Maui) has passed.
jobs:
  pack:
    runs-on: ubuntu-latest
    # About 2x the slowest recent completed tag run (10m28s-12m25s for v1.302.0-v1.304.0, measured
    # 2026-11-18, when the pushes still ran in this job), so a hung restore or test still fails the
    # job instead of holding a runner for the 6-hour default.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      # SEC-Common-64: a v* tag is the one ref pushed directly, outside the branch-protection PR
      # flow, and this workflow re-runs only restore/build/vulnerability audit/test/SBOM. So refuse to
      # publish unless the tagged commit is actually reachable from origin/main: that is what makes the
      # checks which ran only on the merged PR (FACTS drift gate, Helpdesk consumer canary,
      # package-consumption canary, ui-e2e, perf gate) the checks that really covered this tree.
      # Pairs with the `release` environment protection rule on the publish jobs, which need this
      # job. The checkout above uses fetch-depth 0, so only the main branch tip still has to be
      # fetched.
      - name: Assert the tagged commit is on merged main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from origin/main; refusing to publish. Tag a commit that landed on main through a PR."
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is an ancestor of origin/main."

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # SDK 11 builds both target frameworks (global.json pins it); the 10.0 line is installed
          # as well because the net10.0 test assemblies run on the .NET 10 runtime.
          dotnet-version: |
            10.0.x
            11.0.x
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Restore
        # --locked-mode (SEC-ADC-34 / SEC-Common-63): the packages that get packed, SBOM'd and pushed
        # irreversibly to nuget.org must come from the committed lock graph, which is what ADR-038
        # decision 2 claims. Without it a feed movement between the PR run and the tag build silently
        # ships a transitive version nobody reviewed.
        run: dotnet restore MMCA.Common.slnx --locked-mode

      - name: Determine version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Analyzers off: a release tag only ever names a merged main commit, and main requires an
      # up-to-date branch with squash merges, so this exact tree already passed the analyzer-enforcing
      # build-and-test legs of ci.yml. Re-running the five analyzers here would only repeat that work.
      - name: Build
        run: dotnet build MMCA.Common.slnx -c Release --no-restore -p:MinVerSkip=true -p:Version=${{ steps.version.outputs.VERSION }} -p:RunAnalyzers=false

      # The same gate ci.yml build-and-test runs, re-run on the tag build: the graph that gets packed
      # is restored from the lock files here, and an advisory published between the PR run and the
      # tag must stop an irreversible nuget.org push. Same composite action, same accept-list
      # (NuGetAuditSuppress in Directory.Build.props), fails closed (SEC-Common-62, ADR-038).
      - name: Audit dependencies (fail on known vulnerabilities)
        uses: ./.github/actions/nuget-vulnerability-audit
        with:
          solution: MMCA.Common.slnx
          # Restore above already resolved this solution's graph in locked mode; read it as-is.
          no-restore: 'true'

      - name: Test
        # Both frameworks in one run, so twice the per-framework floor ci.yml build-and-test applies
        # to each leg (11250): a discovery/filter regression that silently drops
        # thousands of tests must fail the release, not publish behind a near-empty green run.
        run: dotnet test --solution MMCA.Common.slnx -c Release --no-build --minimum-expected-tests 22500

      - name: Pack
        run: dotnet pack MMCA.Common.slnx -c Release --no-build -o ./nupkgs -p:MinVerSkip=true -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      # Software Bill of Materials for the released packages (CycloneDX).
      # Hard gate (R29 section 32): every published version must ship a verifiable SBOM. The shared
      # composite action fails the release when generation fails OR the BOM lists zero components
      # (ADR-038); the ADC and Store deploy.yml run the identical action from this repository.
      - name: Generate SBOM (CycloneDX)
        uses: ./.github/actions/cyclonedx-sbom
        with:
          solution: MMCA.Common.slnx
          output-dir: ./sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom
          path: ./sbom
          if-no-files-found: error

      # The packed files are the hand-off to the `publish` job, which attests and pushes exactly
      # these bytes. Uploaded last, so only a set that passed every gate above is ever handed on.
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nupkgs
          path: ./nupkgs
          if-no-files-found: error

  publish:
    needs: [pack, pack-maui]
    runs-on: ubuntu-latest
    # Download, attest and two pushes; no restore, build or test runs here.
    timeout-minutes: 10
    # Deployment gate for an IRREVERSIBLE action (SEC-Common-64): nuget.org versions can never be
    # withdrawn (ADR-053), so the publish waits on the `release` environment's protection rules
    # (required reviewer + a deployment policy limited to v* tags), configured in repo settings.
    environment: release
    permissions:
      packages: write
      contents: read
      id-token: write # OIDC token for nuget.org trusted publishing (ADR-053)
      attestations: write # build provenance attestations on the packed nupkgs (ADR-038)
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nupkgs
          path: ./nupkgs

      # Build provenance (ADR-038): a signed SLSA attestation binding each .nupkg to this workflow,
      # this commit and this repository, stored by GitHub and verifiable by anyone with
      # `gh attestation verify <file>.nupkg --owner ivanball`. Needs `attestations: write` above.
      - name: Attest build provenance (nupkgs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./nupkgs/*.nupkg

      # Installs the CLI that runs `dotnet nuget push`. Nothing is checked out in this job, so no
      # global.json, nuget.config or MSBuild file of the repository is read.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source "https://nuget.pkg.github.com/ivanball/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # nuget.org is the public install path (ADR-053). GitHub Packages' NuGet registry requires a
      # PAT with read:packages even for public packages, so a stranger following the README could
      # not restore. Both registries get every release.
      #
      # Auth is trusted publishing, not a stored API key: this job's OIDC token is exchanged for a
      # key that lives one hour, so there is no long-lived secret to leak or rotate. The exchange is
      # bound to a policy on nuget.org pinned to this owner, this repository, and THIS workflow file
      # by their permanent GitHub ids, so renaming the file or forking breaks the exchange by design.
      # Request the key immediately before the push: it expires in an hour and is single-use.
      - name: NuGet login (OIDC to short-lived key)
        if: github.repository_owner == 'ivanball'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ivanball # nuget.org profile name, not an email; public, so not a secret

      - name: Push to nuget.org
        if: github.repository_owner == 'ivanball'
        run: dotnet nuget push ./nupkgs/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate

  # One GitHub release per tag, its notes taken from that version's CHANGELOG.md section (the feed
  # PackageReleaseNotes in Directory.Build.props points at). A separate job so the OIDC publish job
  # keeps contents: read; this job alone can write releases, and it holds no id-token or packages
  # permission. It runs only after BOTH `publish` and `publish-maui` succeeded, so a release never
  # announces a version that did not reach the registries, nor a lockstep set still missing
  # MMCA.Common.UI.Maui. A re-run on a tag whose release already exists skips.
  github-release:
    needs: [publish, publish-maui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          VERSION="${TAG#v}"
          # The lines after the "## [VERSION]" heading, up to the next "## [" heading.
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION; stamp it before tagging."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  # MMCA.Common.UI.Maui (the one MAUI-TFM package; the full id list lives in FACTS.md) cannot
  # build on ubuntu (its platform TFMs need the MAUI workloads), so it packs on windows, versioned
  # from the same tag so the lockstep release stays whole. Same locked restore, vulnerability audit
  # and SBOM hard gate as the main job, scoped to this project.
  pack-maui:
    runs-on: windows-latest
    # Kept at 40, not cut to 2x the slowest recent run (11m40s-14m57s, measured 2026-09-30, when the
    # pushes still ran in this job): no MAUI workload cache on this job, unlike ci.yml build-maui,
    # so the workload install alone varies widely.
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      # SEC-Common-64: a v* tag is the one ref pushed directly, outside the branch-protection PR
      # flow, and this workflow re-runs only restore/build/vulnerability audit/test/SBOM. So refuse to
      # publish unless the tagged commit is actually reachable from origin/main: that is what makes the
      # checks which ran only on the merged PR (FACTS drift gate, Helpdesk consumer canary,
      # package-consumption canary, ui-e2e, perf gate) the checks that really covered this tree.
      # Pairs with the `release` environment protection rule on the publish jobs, which need this
      # job. The checkout above uses fetch-depth 0, so only the main branch tip still has to be
      # fetched.
      - name: Assert the tagged commit is on merged main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from origin/main; refusing to publish. Tag a commit that landed on main through a PR."
            exit 1
          fi
          echo "Tagged commit $GITHUB_SHA is an ancestor of origin/main."

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # SDK 11 builds both target frameworks (global.json pins it); the 10.0 line is installed
          # as well because the net10.0 test assemblies run on the .NET 10 runtime.
          dotnet-version: |
            10.0.x
            11.0.x
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Determine version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Same rule as the main job's restore (SEC-ADC-34 / SEC-Common-63): the package pushed to
      # nuget.org is built from the committed packages.lock.json of this project (every MAUI TFM),
      # so a feed movement between the PR run and the tag fails here instead of shipping. Runs after
      # the workload install because the platform TFMs only resolve with the workloads present.
      - name: Restore
        run: dotnet restore Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj --locked-mode

      # The same composite action and accept-list as the main job, over this project's own graph,
      # so an advisory published after the PR run stops this package too (SEC-Common-62, ADR-038).
      - name: Audit dependencies (fail on known vulnerabilities)
        uses: ./.github/actions/nuget-vulnerability-audit
        with:
          solution: Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj
          # Restore above already resolved this project's graph in locked mode; read it as-is.
          no-restore: 'true'

      - name: Build (every MAUI TFM)
        run: dotnet build Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj -c Release --no-restore -p:MinVerSkip=true -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Pack
        run: dotnet pack Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj -c Release --no-build -o ./nupkgs-maui -p:MinVerSkip=true -p:PackageVersion=${{ steps.version.outputs.VERSION }}

      - name: Generate SBOM (CycloneDX)
        # Shared gate (ADR-038): the composite action fails unless the BOM exists AND lists at least
        # one component, the same check the ADC and Store deploy.yml run through
        # ivanball/MMCA.Common/.github/actions/cyclonedx-sbom, pinned to a release commit SHA.
        uses: ./.github/actions/cyclonedx-sbom
        with:
          solution: Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj
          output-dir: ./sbom-maui

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sbom-maui
          path: ./sbom-maui
          if-no-files-found: error

      # The hand-off to `publish-maui`, which attests and pushes exactly these bytes.
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nupkgs-maui
          path: ./nupkgs-maui
          if-no-files-found: error

  # Pushes the MMCA.Common.UI.Maui package `pack-maui` built. The package is TFM-specific but the
  # push is not, so this job runs on ubuntu like `publish`, where bash expands the *.nupkg globs.
  publish-maui:
    needs: [pack, pack-maui]
    runs-on: ubuntu-latest
    # Download, attest and two pushes; no restore, build or test runs here.
    timeout-minutes: 10
    # Same irreversible-publish gate as the `publish` job (SEC-Common-64); both jobs push to
    # nuget.org, so both wait on the `release` environment.
    environment: release
    permissions:
      packages: write
      contents: read
      id-token: write # OIDC token for nuget.org trusted publishing (ADR-053)
      attestations: write # build provenance attestations on the packed nupkgs (ADR-038)
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nupkgs-maui
          path: ./nupkgs-maui

      # Build provenance (ADR-038): a signed SLSA attestation binding each .nupkg to this workflow,
      # this commit and this repository, stored by GitHub and verifiable by anyone with
      # `gh attestation verify <file>.nupkg --owner ivanball`. Needs `attestations: write` above.
      - name: Attest build provenance (nupkgs)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./nupkgs-maui/*.nupkg

      # Installs the CLI that runs `dotnet nuget push`. Nothing is checked out in this job, so no
      # global.json, nuget.config or MSBuild file of the repository is read.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 11.0.x

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs-maui/*.nupkg --source "https://nuget.pkg.github.com/ivanball/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # Same dual-registry policy and same trusted-publishing exchange as the main job (ADR-053).
      # One nuget.org policy covers both jobs because it is keyed on the workflow FILE, but each job
      # needs its own id-token permission and its own exchange: a short-lived key is single-use and
      # cannot cross a job boundary.
      - name: NuGet login (OIDC to short-lived key)
        if: github.repository_owner == 'ivanball'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ivanball # nuget.org profile name, not an email; public, so not a secret

      - name: Push to nuget.org
        if: github.repository_owner == 'ivanball'
        run: dotnet nuget push ./nupkgs-maui/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
