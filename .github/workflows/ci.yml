  aws-integration:
    name: AWS integration (Testcontainers LocalStack)
    needs: changes
    runs-on: ubuntu-latest
    # The redis-integration budget plus headroom for the larger LocalStack image pull.
    timeout-minutes: 20
    # MMCA.Common.Aws against LocalStack: the S3-compatible store and the SQS/SNS broker transport.
    # The unit tier asserts the requests the adapter builds; only a real endpoint settles whether the
    # S3 API accepts them (checksum posture, path-style addressing), whether Content-Type and
    # Content-Disposition come back on the object, and whether the ambient MMCA-* headers survive SNS
    # + SQS, whose 10-attribute cap MassTransit does not police. Ubuntu runners ship a Docker daemon,
    # so Testcontainers works with no extra setup. Not a required check: promoting it is a
    # branch-protection setting.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Same cache posture and the same reasons as the redis-integration job above.
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run AWS integration tests
        # Code-guarded like every other heavy job: a docs-only PR must not pull a LocalStack image and
        # start a container. The JOB still runs (and posts its context green) so adding this check to
        # branch protection stays safe on docs-only PRs, matching the pattern the other jobs use.
        if: needs.changes.outputs.code == 'true'
        # Deliberately outside MMCA.Common.slnx (it needs Docker, which the fast solution-wide unit
        # loop must not require), so build/run this project directly by path, like
        # redis-integration. Floor = the exact [Fact] count in the project (3 S3 + 2 SQS + 2 Secrets
        # Manager + 1 DataProtection + 6 SNS push, 2026-10-24); adding a test means raising this
        # number in the same PR.
        run: dotnet test Tests/Hosting/MMCA.Common.Aws.LocalStack.Tests/MMCA.Common.Aws.LocalStack.Tests.csproj -c Release --minimum-expected-tests 14

  gcp-integration:
    name: Google Cloud integration (Testcontainers fake-gcs-server + Firestore emulator)
    needs: changes
    runs-on: ubuntu-latest
    # fake-gcs-server is a small single-binary image, but the Firestore emulator ships inside the
    # google-cloud-cli emulators image (about 1.7 GB), so the budget allows for its pull.
    timeout-minutes: 20
    # MMCA.Common.Gcp against fake-gcs-server: the Cloud Storage store over the JSON API. The unit
    # tier asserts the object the adapter builds; only a real endpoint settles whether the API accepts
    # the client's resumable upload, whether Content-Type, Content-Disposition and Cache-Control come
    # back as object metadata, whether the returned URL addresses the object and whether a delete of
    # a missing object maps to success. The DataProtection key ring runs against the same server:
    # only a real endpoint settles whether a stale IfGenerationMatch write is rejected with 412 (the
    # retry that keeps a concurrent writer's key), and whether two hosts on one object share a key
    # ring. The FCM installation registry runs against the Firestore emulator: only a real Firestore
    # settles whether the ownership transaction refuses another device's installation, hands over the
    # same device, lets exactly one of two racing claims win, and whether the UserId WhereIn query
    # (30 values at a time) and the conditional deletes behave (FCM itself has no emulator, so the
    # send side is a recording fake). Ubuntu runners ship a Docker daemon, so Testcontainers works
    # with no extra setup. Not a required check: promoting it is a branch-protection setting.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Same cache posture and the same reasons as the redis-integration job above.
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run Google Cloud integration tests
        # Code-guarded like every other heavy job: a docs-only PR must not pull an emulator image and
        # start a container. The JOB still runs (and posts its context green) so adding this check to
        # branch protection stays safe on docs-only PRs, matching the pattern the other jobs use.
        if: needs.changes.outputs.code == 'true'
        # Deliberately outside MMCA.Common.slnx (it needs Docker, which the fast solution-wide unit
        # loop must not require), so build/run this project directly by path, like
        # aws-integration. Floor = the exact [Fact] count in the project (3 Cloud Storage + 3
        # DataProtection key ring + 8 FCM installation registry, 2026-10-25); adding a test means
        # raising this number in the same PR.
        run: dotnet test Tests/Hosting/MMCA.Common.Gcp.Emulator.Tests/MMCA.Common.Gcp.Emulator.Tests.csproj -c Release --minimum-expected-tests 14

  apphost-testing:
    name: AppHost integration (Aspire.Hosting.Testing)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # BLOCKING: a red here fails the run. This is the only tier that starts a real orchestrator and
    # the slowest thing in the repo per assertion; it is not a required merge check.
    #
    # It closes the one layer nothing else executes: the AppHost wiring itself. The solution build
    # never runs an AppHost, and every in-process test tier boots hosts directly through
    # WebApplicationFactory, bypassing the orchestration, so a renamed resource, an unresolvable
    # reference or a WaitFor cycle is invisible everywhere else.
    #
    # The sample AppHost declares two resources over one sample project (one with a SQLite file, one on
    # the Http2-only h2c profile), so this needs neither a container runtime nor a dev certificate. A
    # consumer stack with an https launch profile adds a `dotnet dev-certs https --trust` step before
    # the test run, since a resource probed over untrusted TLS never turns healthy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Same cache posture and the same reasons as the redis-integration job above.
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run AppHost integration tests
        # Code-guarded like every other heavy job: a docs-only PR must not start an orchestrator. The
        # JOB still runs (and posts its context) so the guard stays safe on docs-only PRs.
        #
        # MMCA_APPHOST_TESTS is the opt-in AppHostEnvironmentGate reads. Without it the whole
        # collection skips with a named reason, which is exactly what happens on a developer machine
        # and is why the unit loop never pays for an orchestrator. --minimum-expected-tests makes a
        # silently skipped tier visible here rather than passing as a no-op.
        if: needs.changes.outputs.code == 'true'
        env:
          MMCA_APPHOST_TESTS: '1'
        # The three projects (test, sample AppHost, sample service) sit outside MMCA.Common.slnx, so
        # this builds and runs by path, like redis-integration and postgresql-integration.
        run: dotnet test Tests/Hosting/MMCA.Common.Testing.Aspire.AppHostTests/MMCA.Common.Testing.Aspire.AppHostTests.csproj -c Release --minimum-expected-tests 1
