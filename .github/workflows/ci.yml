name: CI

# PR-only, deliberately: there is no `push: [main]` trigger.
#
# main is protected with "Require branches to be up to date before merging" (strict), and a
# pull_request check runs against refs/pull/N/merge — main already merged into the PR head. With
# squash merge that merge result IS the tree that lands on main, so a push-triggered re-run
# re-verified an already-verified tree. Measured 2026-07-21..24: 30 such runs, 266 wasted minutes
# in three days, competing for the same concurrency slots as the PR runs they duplicated.
# MMCA.ADC and MMCA.Store already work this way.
#
# Release verification does NOT depend on this: release.yml runs its own restore/build/test on the
# v* tag before publishing.
on:
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (SEC-Common-61). Without this block the token scope is whatever
# the repo/org default happens to be, so a same-repo PR job could hold a write-capable token that
# actions/checkout then persists into .git/config. Nothing in this workflow writes to the repo: no
# job comments on a PR, publishes a package, or pushes a ref, so no job widens this. The checkout
# steps below additionally pass persist-credentials: false, so the token is never left on disk for a
# later step (or for anything a compromised analyzer, test or tool could read).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Redirect Playwright's browser install out of ~/.cache/ms-playwright and into the workspace so
  # actions/cache can carry it between runs (see the ui-e2e "Cache Playwright browsers" step). Both
  # the install and the test run read this, so it must be workflow-level, not step-level.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright

# Supersede an older still-running check set when a PR is pushed again; a stale run's result is
# never actionable. Guarded on event_name so a future non-PR trigger cannot cancel itself.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only short-circuit (ported from MMCA.Store / MMCA.ADC deploy.yml). Classifies the diff and
  # exposes `code`; every heavy STEP below is guarded on it. Guarding steps rather than jobs is
  # deliberate: all 8 required contexts must still post green on a docs-only PR, or branch
  # protection blocks the merge forever. Fail-safe: anything unexpected sets code=true.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        # Ref names reach the script through env, never through ${{ }} template substitution
        # (SEC-Common-60): template values are pasted in before the shell parses the line, so a name
        # containing a quote would break out of the assignment and run as code.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="origin/$BASE_REF"
          git fetch --no-tags --depth=1 origin "$BASE_REF" >/dev/null 2>&1 || true
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "Cannot resolve base ref '$base' — assuming code changed."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only "$base...HEAD"); then
            echo "git diff failed — assuming code changed."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Changed files:"; printf '%s\n' "$changed"
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md) ;;
              *) code=true; break ;;
            esac
          done <<< "$changed"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    runs-on: ubuntu-latest
    # About 2x the slowest of four recent code PR runs (5m11s-6m36s, measured 2026-09-30), so a
    # hung restore or test host fails the job instead of holding a runner for the 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      # Fast, dependency-free drift gate: FACTS.md must match what `build/facts` computes from source
      # (version from the git tag, package count, fitness-method/base counts; the ADR count and range are owned by the Website ADR index). Fails the
      # build if the committed FACTS.md is stale — regenerate with `dotnet run --project build/facts -- .`.
      - name: Verify FACTS.md is current
        # NOT code-guarded: FACTS.md is markdown, so a docs-only PR is exactly the kind of change
        # that can make it drift. This gate must run even when everything else is skipped.
        run: dotnet run --project build/facts -- . --check

      - name: Restore
        if: needs.changes.outputs.code == 'true'
        # --locked-mode (SEC-Common-63 / SEC-ADC-34): restore from the committed packages.lock.json
        # graph or fail. Without it restore silently re-resolves and regenerates the lock files on the
        # runner, so CI builds, audits and packs a graph nobody reviewed. A deliberate dependency
        # change regenerates the lock files locally with `dotnet restore --force-evaluate` and commits
        # them in the same PR. Every project in MMCA.Common.slnx has a lock file (34 of them); the
        # three that do not (build/facts, build/perfgate, Tests/Performance/MMCA.Common.Benchmarks)
        # are outside the slnx and are unaffected.
        run: dotnet restore MMCA.Common.slnx --locked-mode

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: dotnet build MMCA.Common.slnx -c Release --no-restore

      - name: Audit dependencies (fail on known vulnerabilities)
        if: needs.changes.outputs.code == 'true'
        # Fails CLOSED (SEC-Common-62) and honours the NuGetAuditSuppress accept-list in
        # Directory.Build.props. The logic lives in the composite action so this repository and its
        # consumers (ADC and Store deploy.yml, via ivanball/MMCA.Common/.github/actions/...@main) run
        # ONE implementation instead of a per-repository copy that drifts (ADR-038).
        uses: ./.github/actions/nuget-vulnerability-audit
        with:
          solution: MMCA.Common.slnx
          # Restore above already resolved this solution's graph in locked mode; read it as-is.
          no-restore: 'true'

      - name: Install coverage tool
        if: needs.changes.outputs.code == 'true'
        run: dotnet tool install --global dotnet-coverage --version 18.11.0

      - name: Test (with coverage)
        if: needs.changes.outputs.code == 'true'
        # dotnet-coverage wraps the MTP run and emits cobertura; it returns the test exit code so a
        # test failure still gates. Coverage is report-only (see the `coverage` job).
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Floor at 2000, far below the suite size: a discovery/filter regression that silently drops
          # thousands of tests must fail the job, not pass green with a handful discovered.
          dotnet-coverage collect -f cobertura -o coverage.unit.cobertura.xml \
            "dotnet test --solution MMCA.Common.slnx -c Release --no-build --minimum-expected-tests 2000"

      - name: Upload coverage (unit + architecture + bUnit)
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-unit
          path: coverage.unit.cobertura.xml
          if-no-files-found: warn

  # The MAUI multi-target package (MMCA.Common.UI.Maui) cannot build on ubuntu — its four TFMs
  # (android/ios/maccatalyst/windows) need the MAUI workloads — so it builds in its own
  # windows job and stays OUT of MMCA.Common.slnx, the same mechanism that keeps the gallery
  # and UI E2E projects out of the unit run. Required merge gate alongside build-and-test.
  # (No tests here: the capability contracts and fallbacks are covered in MMCA.Common.UI.Tests
  # on ubuntu; the MAUI implementations are thin Essentials wrappers exercised on-device.)
  build-maui:
    name: Build MMCA.Common.UI.Maui (windows, 4 TFMs)
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      # No workload cache, by measurement (2026-10-07, PR #523): saving the 2.2 GB of packs took
      # 430s, a hit still spent 225s restoring plus 192s in this install, and a cache saved by a
      # pull_request run is only visible to that same PR. Every variant was slower than the plain
      # install below (~380s).
      - name: Install MAUI workload
        if: needs.changes.outputs.code == 'true'
        run: dotnet workload install maui

      - name: Build (android + ios + maccatalyst + windows)
        if: needs.changes.outputs.code == 'true'
        run: dotnet build Source/Presentation/MMCA.Common.UI.Maui/MMCA.Common.UI.Maui.csproj -c Release

  # Real-browser axe (WCAG 2.1 AA) + render-smoke gate for the shared MMCA.Common.UI. A backend-less
  # gallery host (Tests/Presentation/MMCA.Common.UI.Gallery) renders the real Login/Register pages and a
  # primitives showcase; MMCA.Common.UI.E2E.Tests self-hosts it in-process and scans it with Playwright.
  # Kept in its own job (browser install + headed-ish run) and OUT of MMCA.Common.slnx so the unit
  # `dotnet test --solution` above stays fast.
  ui-e2e:
    name: UI a11y + render smoke (${{ matrix.browser }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 34
    strategy:
      # Don't let one engine's failure cancel the others; surface each engine's result independently.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # All three engines are required merge gates (§22): firefox promoted 2026-07-12 after a clean
    # observed streak, webkit promoted 2026-07-16 after 11 consecutive green main runs since its
    # last flake (2026-07-12 00:45). Add the webkit check to branch protection alongside the others.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Build UI E2E project
        if: needs.changes.outputs.code == 'true'
        # The gallery + E2E projects are intentionally outside the .slnx, so build this graph directly
        # (restore included). They reference MMCA.Common source projects — no GitHub Packages token needed.
        run: dotnet build Tests/Presentation/MMCA.Common.UI.E2E.Tests/MMCA.Common.UI.E2E.Tests.csproj -c Release

      # The browser builds are a function of the Microsoft.Playwright version alone, so that version
      # (not a hash of the whole props file, which every unrelated bump changed) keys the cache below.
      - name: Resolve Playwright version
        if: needs.changes.outputs.code == 'true'
        id: playwright-version
        run: |
          version=$(grep -oP '<PackageVersion Include="Microsoft\.Playwright" Version="\K[^"]+' Directory.Packages.props)
          if [ -z "$version" ]; then
            echo "::error::Microsoft.Playwright PackageVersion not found in Directory.Packages.props"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The runner image pins the OS package versions the apt cache below holds.
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      # Browser binaries are ~100-300 MB per engine and were re-downloaded on all three legs of every
      # run. PLAYWRIGHT_BROWSERS_PATH (workflow env) redirects the install into the workspace so
      # actions/cache can carry it; the key includes the engine, since each leg installs only its own.
      - name: Cache Playwright browsers (${{ matrix.browser }})
        if: needs.changes.outputs.code == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}

      # The engine's OS packages (webkit: ~130 .debs, 117 MB) otherwise come from the runner's apt
      # mirror on EVERY run, and that mirror can crawl without erroring: webkit sat in the install
      # until the job's 20-minute timeout (PRs #592 and #603). The .debs land in this cached directory
      # instead, so a warm run installs offline, and a cold one resumes across retries rather than
      # restarting. restore-keys reuses an older image's set; apt fetches only what changed.
      - name: Cache apt packages (${{ matrix.browser }})
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.apt-archives/*.deb
          key: apt-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}-${{ steps.playwright-version.outputs.image }}
          restore-keys: apt-${{ matrix.browser }}-${{ steps.playwright-version.outputs.version }}-

      # Every attempt is bounded and retried. The OS half runs the Playwright CLI as root under
      # `sudo timeout`, so apt-get is in timeout's own process group and dies with it; letting the CLI
      # elevate itself put apt-get behind a separate sudo session that survived the timeout and held
      # the dpkg lock against every retry.
      - name: Install Playwright (${{ matrix.browser }})
        if: needs.changes.outputs.code == 'true'
        timeout-minutes: 26
        run: |
          archives="$GITHUB_WORKSPACE/.apt-archives"
          mkdir -p "$archives/partial"
          printf '%s\n' \
            'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            "Dir::Cache::Archives \"$archives/\";" 'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' 'APT::Sandbox::User "root";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-playwright > /dev/null
          script=$(find Tests/Presentation/MMCA.Common.UI.E2E.Tests/bin/Release -name playwright.ps1 | head -1)

          # Put the fastest Ubuntu mirror first. The runner's apt sources read the mirror list in
          # /etc/apt/apt-mirrors.txt (azure.archive.ubuntu.com first), and apt moves to the next entry
          # only on an ERROR, never on a slow transfer: on 2026-10-26 the Azure mirror served ~25 KB/s
          # for over an hour, so webkit's 117 MB of deps could not finish inside any bound (#615). Each
          # candidate (the listed mirrors plus archive.ubuntu.com) gets a 20s probe of one ~1.4 MB index;
          # a non-200 or failed probe scores 0, and the list is left alone when the first entry wins.
          mirrors=/etc/apt/apt-mirrors.txt
          if [ -f "$mirrors" ]; then
            codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
            mapfile -t urls < <({ awk '{print $1}' "$mirrors"; echo 'http://archive.ubuntu.com/ubuntu/'; } | awk 'NF && !seen[$0]++')
            best=""; best_speed=0
            for u in "${urls[@]}"; do
              probe=$(curl -fsS -o /dev/null --max-time 20 -w '%{http_code} %{speed_download}' \
                "${u%/}/dists/${codename}-updates/main/binary-amd64/Packages.gz" 2>/dev/null) || true
              speed=${probe##* }
              [ "${probe%% *}" = "200" ] || speed=0
              echo "apt mirror probe: $u ${speed%.*} B/s"
              if awk -v a="$speed" -v b="$best_speed" 'BEGIN { exit !(a > b) }'; then best=$u; best_speed=$speed; fi
            done
            if [ -n "$best" ] && [ "$best" != "${urls[0]}" ]; then
              {
                printf '%s\tpriority:1\n' "$best"; n=2
                for u in "${urls[@]}"; do [ "$u" = "$best" ] && continue; printf '%s\tpriority:%s\n' "$u" "$n"; n=$((n + 1)); done
              } | sudo tee "$mirrors" > /dev/null
              echo "::notice::apt mirror list reordered: $best first (${best_speed%.*} B/s)"
            fi
          fi

          retry() { # retry <seconds-per-attempt> <command...>
            local budget=$1; shift
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              echo "::warning::'$*' attempt $attempt failed or timed out ($budget s budget); retrying"
              sudo dpkg --configure -a || true
            done
            echo "::error::'$*' failed after 3 attempts"; return 1
          }

          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            retry 180 timeout --kill-after=20 180 pwsh "$script" install ${{ matrix.browser }}
          fi
          # No -E: install-deps needs no runner environment, and root's own HOME keeps pwsh's caches
          # out of the runner user's home. A stalled transfer is already cut by the 30s apt HTTP
          # timeouts above; the per-attempt bound only has to outlast a SLOW mirror. Downloaded .debs
          # survive into the next attempt, so the three attempts add up: at 240s the webkit set (fonts,
          # codecs, GStreamer, the largest of the three engines) missed all three on a slow
          # azure.archive.ubuntu.com while still progressing (PR #615, 2026-10-26).
          retry 480 sudo timeout --kill-after=20 480 pwsh "$script" install-deps ${{ matrix.browser }}

          # The post-job cache save runs as the runner user.
          sudo chown -R "$(id -u):$(id -g)" "$archives"
          echo "apt archive: $(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) .deb files"

      - name: Run UI E2E (axe + render smoke)
        if: needs.changes.outputs.code == 'true'
        env:
          E2E_HEADLESS: "true"
          E2E_BROWSER: ${{ matrix.browser }}
        run: dotnet test --project Tests/Presentation/MMCA.Common.UI.E2E.Tests/MMCA.Common.UI.E2E.Tests.csproj -c Release --no-build -- --minimum-expected-tests 1

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-e2e-traces-${{ matrix.browser }}
          path: Tests/Presentation/MMCA.Common.UI.E2E.Tests/bin/Release/net10.0/playwright-traces/**
          if-no-files-found: ignore

  # Performance gate (§12): build + run the BenchmarkDotNet harness with the Short job (3 warmup + 3
  # iterations, so real measurements in under a minute) on every PR, then check those results against the
  # committed baseline. This is a REGRESSION gate, not just a runs-clean one: build/perfgate fails the job
  # when a benchmarked hot path (Specification compiled-expression cache + criteria composition) breaches
  # an allocation ceiling or drops below a ratio floor, and a rule naming a benchmark that produced no
  # measurement fails too, so the gate cannot pass vacuously. Moving a number deliberately means updating
  # Tests/Performance/perf-baseline.json in the same PR (see CLAUDE.md and the published COST guide). Kept
  # OUT of MMCA.Common.slnx (like ui-e2e) so the unit `dotnet test --solution` run stays fast.
  performance-smoke:
    name: Performance gate (BenchmarkDotNet Short + baseline verify)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer (on the referenced Source projects) needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run hot-path benchmarks (Short job, JSON export)
        if: needs.changes.outputs.code == 'true'
        # The Benchmarks project references MMCA.Common source directly (no GitHub Packages token needed),
        # like the UI E2E project. --filter "*" selects every benchmark non-interactively (without it BDN
        # prompts for a selection and would hang in CI); --job Short (3 warmup + 3 iterations) gives real
        # measurements in under a minute. --no-launch-profile keeps it deterministic on hosted runners.
        run: dotnet run -c Release --project Tests/Performance/MMCA.Common.Benchmarks --no-launch-profile -- --filter "*" --job Short --exporters json

      - name: Verify against committed perf baseline (rubric section 12)
        if: needs.changes.outputs.code == 'true'
        # Latency-regression gate, not just runs-clean: build/perfgate compares the BDN results against
        # Tests/Performance/perf-baseline.json (deterministic allocation ceilings + machine-independent
        # ratio floors such as the compiled-expression cache staying >= 1000x ahead of the recompile
        # anti-pattern) and fails the job on any violation. Moving the numbers deliberately means
        # updating the baseline file in the same PR.
        run: dotnet run --project build/perfgate -- BenchmarkDotNet.Artifacts/results Tests/Performance/perf-baseline.json

  # Turn the unit/architecture/bUnit coverage into a report, publish it to the run summary, and
  # enforce a coverage FLOOR as a regression backstop (see "Enforce coverage floor"). Runs after
  # build-and-test regardless of its outcome.
  coverage:
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    # Recent runs take 19s-27s (measured 2026-09-30), so 2x is under a minute; 5 matches the
    # smallest timeout in this file (`changes`) and still bounds a hung tool install or download.
    timeout-minutes: 5
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Download coverage artifacts
        if: needs.changes.outputs.code == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      - name: Generate merged coverage report
        if: needs.changes.outputs.code == 'true'
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:'coverage/**/*.cobertura.xml' \
            -targetdir:coverage-report \
            -reporttypes:'Html;TextSummary;MarkdownSummaryGithub' \
            -assemblyfilters:'+MMCA.*;-*.Tests' \
            -filefilters:'-**/*.generated.cs;-**/*.g.cs'
          echo "## Test coverage (unit + architecture + bUnit)" >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt

      # Coverage floor (§14): a regression backstop gating the UNIT/arch/bUnit tier, with GENERATED code
      # excluded (*.generated.cs / *.g.cs) — source generators (e.g. Microsoft.AspNetCore.OpenApi) emit
      # large uncovered files that otherwise tank the number (raw 45.3% vs hand-written 61.9% on
      # 2026-06-19). We gate the unit tier, not the merged report (the gallery E2E tier dilutes it). 68.3%
      # sits 2 points below the 70.3% measured after the 2026-07 coverage program (session auth, broker
      # bus, Grpc/OAuth/JWKS, UI services); ratchet up as it grows. Parsing uses sed (locale-robust).
      - name: Enforce coverage floor (unit/arch/bUnit tier, generated code excluded)
        # Only enforce when build-and-test succeeded (so the unit coverage artifact exists); an upstream
        # failure shouldn't add a confusing secondary coverage failure.
        if: success() && needs.changes.outputs.code == 'true' && needs.build-and-test.result == 'success'
        run: |
          unit="coverage/coverage.unit.cobertura.xml"
          test -f "$unit" || { echo "::error::unit coverage report not found ($unit)"; exit 1; }
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator -reports:"$unit" -targetdir:coverage-unit-report -reporttypes:TextSummary -assemblyfilters:'+MMCA.*;-*.Tests' -filefilters:'-**/*.generated.cs;-**/*.g.cs'
          line=$(sed -n 's/.*Line coverage:[[:space:]]*\([0-9.]*\)%.*/\1/p' coverage-unit-report/Summary.txt | head -1)
          test -n "$line" || { echo "::error::could not parse unit line coverage"; exit 1; }
          awk -v l="$line" -v m="68.3" 'BEGIN{ if (l+0 < m+0) { printf("::error::Unit line coverage %.1f%% is below the %.1f%% floor\n", l, m); exit 1 } printf("Unit line coverage %.1f%% meets the %.1f%% floor\n", l, m) }'

  # Cross-repo pre-merge canary: build a real consumer (MMCA.Helpdesk) against THIS PR's framework
  # source, so a breaking public-API change fails here instead of surfacing only after a release +
  # lockstep sweep. Helpdesk is the ideal canary: minimal single-module app, no database and no
  # GitHub Packages token to build (it ships a committed local.props that swaps the MMCA.Common.*
  # PackageReferences for ProjectReferences into ../MMCA.Common/Source via UseLocalMMCA). The two
  # repos are checked out as siblings so Helpdesk's local.props path (..\MMCA.Common\Source)
  # resolves to this PR's checkout. Promoted to a required merge gate 2026-07-16 after 9
  # consecutive green runs since introduction (2026-07-14); its context is in branch protection.
  # It also proves the framework's MIGRATION path end to end (rubric #8): the consumer's real EF
  # migrations are applied to an ephemeral SQL Server, so a framework change that breaks
  # `dotnet ef database update` fails here instead of at a consumer's deploy.
  consumer-source-build:
    name: Consumer source build (Helpdesk)
    needs: changes
    runs-on: ubuntu-latest
    # 20 covered the build+test pair; the SQL container, its readiness poll and the migration apply
    # add a few minutes on a cold cache.
    timeout-minutes: 30
    env:
      # Throwaway SA password for a container that lives and dies with this job. Not a secret:
      # keeping it inline (as ADC's integration job does) means no secret is needed to run the gate
      # from a fork, and there is nothing to rotate.
      MSSQL_SA_PASSWORD: "Helpdesk_Canary!Test1"
      # The database the Helpdesk design-time factory targets. Its DesignTimeSQLServerDbContextFactory
      # reads HELPDESK_TICKETS_SQL and falls back to a Trusted_Connection localhost string, which
      # cannot work on a Linux runner, so the apply step below overrides it.
      HELPDESK_TICKETS_DB: HelpdeskMigrationCanary
      # Pinned to a specific 2022 cumulative update instead of 2022-latest, so a new CU cannot change
      # what this required gate runs without a reviewed diff. Newest 2022-CU*-ubuntu-22.04 tag in
      # https://mcr.microsoft.com/v2/mssql/server/tags/list, checked 2026-09-30. The
      # sqlserver-integration tier (SQLServerPersistenceTests.cs) pins the same tag; bump both.
      SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    steps:
      - name: Checkout MMCA.Common (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: MMCA.Common
          fetch-depth: 0 # MinVer needs full history

      # Coordinated-break support: a deliberate breaking framework change cannot land while the
      # canary pins Helpdesk main (Helpdesk cannot adapt first, because its own CI builds against
      # THIS repo's main: a mutual deadlock). Convention: push the Helpdesk adaptation to a branch
      # with the SAME NAME as this PR's head branch; the canary then builds that pair together.
      # No matching branch means main, i.e. the original behavior.
      - name: Resolve Helpdesk canary ref (same-name branch, else main)
        id: helpdesk-ref
        # HEAD_REF reaches the script through env, never through ${{ }} template substitution
        # (SEC-Common-60): github.head_ref is the PR author's branch name, git ref rules permit a
        # single quote, and a template value is pasted in before the shell parses the line, so a fork
        # branch named a'$(...)'b would otherwise break out of this assignment and run as code here.
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          ref=main
          head="${HEAD_REF:-}"
          if [ -n "$head" ] && git ls-remote --exit-code --heads https://github.com/ivanball/MMCA.Helpdesk.git "$head" >/dev/null 2>&1; then
            ref="$head"
          fi
          echo "Using MMCA.Helpdesk ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout MMCA.Helpdesk (consumer canary)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: ivanball/MMCA.Helpdesk
          ref: ${{ steps.helpdesk-ref.outputs.ref }}
          path: MMCA.Helpdesk
          fetch-depth: 0
          # Public repo builds with the default token; if Helpdesk is private, set a
          # CONSUMER_CANARY_PAT secret with contents:read on it.
          token: ${{ secrets.CONSUMER_CANARY_PAT || github.token }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      # Started BEFORE the build so SQL Server warms up (~30-60s) while the solution compiles; the
      # readiness poll below then usually returns on its first try. A guarded STEP rather than a
      # job-level `services:` block, so a docs-only PR pays no SQL cost while this job still posts
      # its required status green.
      - name: Start SQL Server (ephemeral, for the migration apply)
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run -d --name sqlserver \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" \
            -e MSSQL_PID=Developer \
            -p 1433:1433 \
            "$SQLSERVER_IMAGE"

      - name: Build Helpdesk against Common source (UseLocalMMCA)
        if: needs.changes.outputs.code == 'true'
        working-directory: MMCA.Helpdesk
        # Helpdesk's committed local.props already sets UseLocalMMCA=true and points at the sibling
        # ../MMCA.Common/Source, so this compiles the reference app against the PR's framework source.
        run: dotnet build MMCA.Helpdesk.slnx -c Release

      - name: Test Helpdesk (domain + architecture, no DB)
        if: needs.changes.outputs.code == 'true'
        working-directory: MMCA.Helpdesk
        # Helpdesk's suite is ~91 tests; floor at 40 so a discovery/filter regression fails
        # instead of passing green with near-zero tests discovered.
        run: dotnet test --solution MMCA.Helpdesk.slnx -c Release --no-build --minimum-expected-tests 40

      # go-sqlcmd (the Go rewrite) rather than the mssql-tools deb: a single static binary with no
      # apt source and no EULA prompt. Used by the readiness poll and by the post-apply assertions.
      # Pinned to one release and verified against its sha256 before anything is extracted as root:
      # releases/latest piped straight into `sudo tar` ran whatever the newest upload was, unchecked.
      # v1.10.0 is the newest release as of 2026-09-30; the digest is the one GitHub publishes for the
      # sqlcmd-linux-amd64.tar.bz2 asset (`gh release view v1.10.0 --repo microsoft/go-sqlcmd --json
      # assets`), re-computed with sha256sum over a downloaded copy. Bump the version and the digest
      # together.
      - name: Install sqlcmd
        if: needs.changes.outputs.code == 'true'
        env:
          SQLCMD_VERSION: v1.10.0
          SQLCMD_SHA256: 92516d98c63d99b0994de5b61350c91f6915f9b76f139a59039fbcb225c2e987
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/sqlcmd-linux-amd64.tar.bz2"
          curl -fsSL -o "$tarball" \
            "https://github.com/microsoft/go-sqlcmd/releases/download/$SQLCMD_VERSION/sqlcmd-linux-amd64.tar.bz2"
          echo "$SQLCMD_SHA256  $tarball" | sha256sum -c -
          sudo tar -xjf "$tarball" -C /usr/local/bin/

      # The container reports "running" long before the engine accepts logins, so poll a real query
      # rather than docker state. 30 x 5s covers a cold image pull on a slow runner.
      - name: Wait for SQL Server
        if: needs.changes.outputs.code == 'true'
        run: |
          for i in $(seq 1 30); do
            if sqlcmd -S localhost,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            echo "Waiting for SQL Server ($i/30)..."
            sleep 5
          done
          echo "::error::SQL Server did not become ready in time"
          docker logs sqlserver || true
          exit 1

      # Pinned to the same version ADC and Store deploy with, so the canary exercises the tool the
      # consumers actually run their migrations through.
      - name: Install EF Core tools
        if: needs.changes.outputs.code == 'true'
        run: dotnet tool install --global dotnet-ef --version 10.0.8

      # The point of the whole SQL half of this job: apply a REAL consumer's committed migrations,
      # built against THIS PR's framework source, to a real SQL Server. `migrations add` and the
      # model-drift gate never open a connection, so neither notices a framework change that breaks
      # the generated DDL, the history table, or the design-time context wiring. `database update`
      # does, and it creates the database as its first act.
      # --no-build is safe: the Release build above covers MMCA.Helpdesk.slnx, which includes the
      # migrations project. The project IS the startup project (it ships its own
      # DesignTimeSQLServerDbContextFactory), and SQLServerDbContext is the framework's single
      # per-engine context class (ADR-006), not a per-module subclass.
      - name: Apply Helpdesk Tickets migrations to SQL Server
        if: needs.changes.outputs.code == 'true'
        working-directory: MMCA.Helpdesk
        env:
          HELPDESK_TICKETS_SQL: "Server=localhost,1433;Database=${{ env.HELPDESK_TICKETS_DB }};User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update \
            --project Source/Hosting/MMCA.Helpdesk.Migrations.SqlServer.Tickets \
            --startup-project Source/Hosting/MMCA.Helpdesk.Migrations.SqlServer.Tickets \
            --context SQLServerDbContext \
            --configuration Release \
            --no-build

      # `dotnet ef database update` exits 0 on a no-op, so a wiring mistake that applied nothing
      # would pass the step above silently. Assert the outcome instead: migrations recorded in the
      # history table, plus one module table and one framework table actually present. The framework
      # table (dbo.OutboxMessages) is the half that belongs to MMCA.Common, so a change that stops
      # the framework's own tables reaching a consumer's schema fails right here.
      - name: Assert migrations were recorded and the schema exists
        if: needs.changes.outputs.code == 'true'
        run: |
          # Read the job env var directly rather than interpolating ${{ env.* }} into the script:
          # same quoting hazard as HEAD_REF above (SEC-Common-60).
          db="$HELPDESK_TICKETS_DB"
          query() {
            sqlcmd -S localhost,1433 -U sa -P "$MSSQL_SA_PASSWORD" -C -d "$db" -h -1 -W \
              -Q "SET NOCOUNT ON; $1"
          }

          applied=$(query "SELECT COUNT(*) FROM __EFMigrationsHistory")
          echo "Applied migrations: $applied"
          if [ "${applied:-0}" -lt 1 ]; then
            echo "::error::No rows in __EFMigrationsHistory: the migration apply was a silent no-op"
            exit 1
          fi

          for table in "Tickets.Ticket" "dbo.OutboxMessages"; do
            schema="${table%%.*}"
            name="${table##*.}"
            found=$(query "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA = '$schema' AND TABLE_NAME = '$name'")
            if [ "${found:-0}" -lt 1 ]; then
              echo "::error::Table $table is missing after the migration apply"
              exit 1
            fi
            echo "Table $table exists"
          done

  # Package-mode consumption canary: pack every slnx package into a local folder feed, then
  # restore + build a minimal throwaway consumer against those nupkgs. Catches pack breaks (NU5xxx)
  # and package-mode-only restore/analyzer/reference failures BEFORE a release: source-mode builds
  # (local.props, and the consumer-source-build job above) bind ProjectReferences, so this failure
  # mode has shipped twice without CI seeing it. MinVer is skipped with an explicit CI-only version
  # (the same mechanism release.yml uses), so the consumer can pin the packed version exactly; its
  # nuget.config maps MMCA.Common.* to the local feed and everything else to nuget.org. The
  # throwaway consumer lives in RUNNER_TEMP, outside the repo checkout, so it does NOT inherit
  # Directory.Build.props/Directory.Packages.props — it consumes the packages the way a real
  # downstream app does. Runs parallel to build-and-test, not behind it.
  package-consumption:
    name: Package-mode consumer (pack + local feed)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK_VERSION: 0.0.1-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history (MinVerSkip pins the version, but keep parity)

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      # Every stage runs build/consumer-check/Invoke-ConsumerCheck.ps1, the one implementation a
      # contributor also runs locally (`pwsh build/consumer-check/Invoke-ConsumerCheck.ps1` runs all
      # four stages). One stage per step keeps each step's name and log; PACK_VERSION (job env) pins
      # the same version across the steps, the feed defaults to <checkout>/nupkgs and the consumer
      # to RUNNER_TEMP/pkg-consumer.
      - name: Pack all packages to a local folder feed
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        run: ./build/consumer-check/Invoke-ConsumerCheck.ps1 -Stage Pack

      - name: Scaffold throwaway package consumer
        if: needs.changes.outputs.code == 'true'
        # A classlib referencing the meta set (API + Infrastructure + Testing.Architecture) pulls
        # the full package graph transitively; the smoke type proves the refs actually bind.
        shell: pwsh
        run: ./build/consumer-check/Invoke-ConsumerCheck.ps1 -Stage Scaffold

      - name: Restore and build consumer against the packed nupkgs
        if: needs.changes.outputs.code == 'true'
        shell: pwsh
        run: ./build/consumer-check/Invoke-ConsumerCheck.ps1 -Stage Build

      - name: Layer rules ship with the packages (compile-time probes)
        if: needs.changes.outputs.code == 'true'
        # MMCA.Common.Shared carries buildTransitive/MMCA.Common.Shared.targets (ADR-015 / ADR-058):
        # a consumer project named {App}.{Module}.{Layer} gets the layer rules at
        # ResolveProjectReferences with no opt-in. One positive and two negative probes prove the
        # import reaches a package-mode consumer AND that both error codes fire: a passing probe on
        # its own would also pass if the file were silently missing from the package.
        shell: pwsh
        run: ./build/consumer-check/Invoke-ConsumerCheck.ps1 -Stage Probes

  # Reference-deployment validation gate (§17): the samples/deployment Bicep is the framework's
  # distilled IaC/OIDC reference (a library cannot deploy itself; DEPLOYMENT.md), so keep it
  # continuously compilable instead of trusting it not to rot. `az bicep build` type-checks both
  # templates (declarations, resource API versions, param wiring) with no cloud credentials and
  # fails the job on any error; warnings surface in the log. A real what-if/deploy stays a
  # consumer-side concern (ADC/Store deploy.yml are the production-proven versions).
  sample-deployment-validate:
    name: Validate samples/deployment Bicep
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compile foundation.bicep
        if: needs.changes.outputs.code == 'true'
        run: az bicep build --file samples/deployment/foundation.bicep --stdout > /dev/null

      - name: Compile main.bicep
        if: needs.changes.outputs.code == 'true'
        run: az bicep build --file samples/deployment/main.bicep --stdout > /dev/null

  redis-integration:
    name: Redis integration (Testcontainers)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # DistributedCacheService is the one place where the STORAGE FORMAT matters, and a
    # Mock<IDistributedCache> cannot express it: Redis keys are typed, so a counter written as a
    # string and read back as a hash round-trips perfectly against a mock and answers WRONGTYPE
    # against a server. This tier runs the shipped cache against a real Redis. Ubuntu runners ship a
    # Docker daemon, so Testcontainers works with no extra setup.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Cache ~/.nuget/packages. Keyed on the committed lock files PLUS Directory.Packages.props,
          # because build/facts, build/perfgate and the Benchmarks project sit outside
          # MMCA.Common.slnx and carry no lock file, so the props file is what pins their versions.
          # Every project the slnx restore touches DOES have one, and that restore now runs
          # --locked-mode, so it fails rather than silently re-resolving a drifted graph.
          # Gated on the code flag: on a docs-only PR every restore step is skipped, so
          # ~/.nuget/packages is never created and setup-dotnet's cache-SAVE step fails the whole
          # job with "Cache folder path ... doesn't exist on disk".
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run Redis integration tests
        # Code-guarded like every other heavy job: a docs-only PR must not pull a Redis image and
        # start a container. The JOB still runs (and posts its context green) so adding this check to
        # branch protection stays safe on docs-only PRs, matching the pattern the other jobs use.
        if: needs.changes.outputs.code == 'true'
        # Deliberately outside MMCA.Common.slnx (it needs Docker, which the fast solution-wide unit
        # loop must not require), so build/run this project directly by path, like ui-e2e does.
        # Floor = the exact [Fact] count in the project (5 DistributedCacheService + 10
        # HybridCacheService, 2026-09-30): a tier that silently discovers fewer tests fails here.
        # Adding a test means raising this number in the same PR.
        run: dotnet test Tests/Core/MMCA.Common.Infrastructure.Redis.Tests/MMCA.Common.Infrastructure.Redis.Tests.csproj -c Release --minimum-expected-tests 15

  postgresql-integration:
    name: PostgreSQL integration (Testcontainers)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The PostgreSQL provider is the one place where the SQL the framework EMITS matters, and a model
    # assertion cannot express it: a partial-index predicate written the SQL Server way
    # ([ProcessedOn] IS NULL), a soft-delete predicate comparing a boolean to 0, and a DateTime whose
    # Kind is not UTC all build a perfectly valid EF model and are rejected by the server. This tier
    # runs the shipped PostgreSQLDbContext, and the built-in PostgreSql broker transport (MassTransit's
    # SQL transport), against a real PostgreSQL. Ubuntu runners ship a Docker
    # daemon, so Testcontainers works with no extra setup.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Same cache posture and the same reasons as the redis-integration job above.
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run PostgreSQL integration tests
        # Code-guarded like every other heavy job: a docs-only PR must not pull a PostgreSQL image and
        # start a container. The JOB still runs (and posts its context green) so adding this check to
        # branch protection stays safe on docs-only PRs, matching the pattern the other jobs use.
        if: needs.changes.outputs.code == 'true'
        # Deliberately outside MMCA.Common.slnx (it needs Docker, which the fast solution-wide unit
        # loop must not require), so build/run this project directly by path, like redis-integration.
        # Floor = the exact [Fact] count across PostgreSQLPersistenceTests.cs (8) and
        # PostgreSqlBrokerTransportTests.cs (3: the built-in PostgreSql broker's header round trip,
        # delayed redelivery and shared data-source authentication), 11 on 2026-10-25; adding a test
        # means raising this number in the same PR.
        run: dotnet test Tests/Core/MMCA.Common.Infrastructure.PostgreSQL.Tests/MMCA.Common.Infrastructure.PostgreSQL.Tests.csproj -c Release --minimum-expected-tests 11

  sqlserver-integration:
    name: SQL Server integration (Testcontainers)
    needs: changes
    runs-on: ubuntu-latest
    # The PostgreSQL tier's 15 plus headroom for the larger SQL Server image pull and its slower
    # engine start (the tier starts one container per test, three in all).
    timeout-minutes: 20
    # The SQL Server provider is the engine where SESSION state and server-generated values matter,
    # and neither a mock nor SQLite can express them: SET IDENTITY_INSERT holds only on the session
    # that ran it, a rowversion is issued by the server on every write, and the outbox row must reach
    # the database in the same SaveChanges as its aggregate. This tier runs the shipped
    # SQLServerDbContext and DbContextFactory against a real SQL Server. Ubuntu runners ship a Docker
    # daemon, so Testcontainers works with no extra setup. Not a required check (yet): promoting it
    # is a branch-protection setting.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # MinVer needs full history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
          # Same cache posture and the same reasons as the redis-integration job above.
          cache: ${{ needs.changes.outputs.code == 'true' }}
          cache-dependency-path: |
            **/packages.lock.json
            Directory.Packages.props

      - name: Run SQL Server integration tests
        # Code-guarded like every other heavy job: a docs-only PR must not pull a SQL Server image and
        # start a container. The JOB still runs (and posts its context green) so adding this check to
        # branch protection stays safe on docs-only PRs, matching the pattern the other jobs use.
        if: needs.changes.outputs.code == 'true'
        # Deliberately outside MMCA.Common.slnx (it needs Docker, which the fast solution-wide unit
        # loop must not require), so build/run this project directly by path, like
        # postgresql-integration. Floor = the exact [Fact] count in SQLServerPersistenceTests.cs (3,
